<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Aero Academy</title>
  <desc id="desc">A stylized aircraft wing mark on a dark blue background.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="68%">
      <stop offset="0" stop-color="#0b355d"/>
      <stop offset="1" stop-color="#020915"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" x2="1" y1="1" y2="0">
      <stop stop-color="#078df5"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="270" r="142" fill="#06162a" stroke="#0d79c9" stroke-width="8"/>
  <path d="M480 318c65-113 132-84 280-225-28 94-93 188-223 235 65-9 130-37 185-84-37 94-139 141-213 132z" fill="url(#wing)"/>
  <path d="M483 291c74 0 139-28 213-94" fill="none" stroke="#0c70df" stroke-width="18" stroke-linecap="round"/>
  <text x="600" y="500" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="14" text-anchor="middle">AERO ACADEMY</text>
  <text x="600" y="552" fill="#8faccc" font-family="Arial, sans-serif" font-size="25" letter-spacing="5" text-anchor="middle">LEARN. UNDERSTAND. FLY.</text>
</svg>
